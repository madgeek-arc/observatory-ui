<app-card-state [state]="state()" [height]="200" [empty]="isEmpty()">
  <ng-template>
    @if (chartOptions(); as options) {
      <highcharts-chart [Highcharts]="Highcharts" [options]="options" [oneToOne]="true"
                        style="width: 100%; display: block;"></highcharts-chart>

      <div class="uk-flex uk-flex-center uk-flex-wrap uk-margin-small-top" style="gap: 16px;">
        @for (country of selectedCountries(); track country.id) {
          <div class="uk-flex uk-flex-middle" style="gap: 6px;">
            <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%;" [style.background]="country.color"></span>
            <span class="uk-text-small uk-text-muted">{{ country.name }}</span>
          </div>
        }
      </div>
    }
  </ng-template>
</app-card-state>
