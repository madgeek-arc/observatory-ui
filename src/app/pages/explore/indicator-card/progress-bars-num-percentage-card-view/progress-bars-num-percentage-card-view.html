<app-card-state [state]="state()" [height]="60" [empty]="isEmpty()">
  <ng-template>
    @for (row of rows(); track row.id; let index = $index) {
      <div class="uk-grid-small uk-flex-middle uk-margin-small-bottom" uk-grid>
        <div class="uk-width-auto uk-text-small uk-text-meta">{{ index + 1 }}.</div>
        <div class="uk-width-xsmall uk-text-small uk-text-truncate">{{ row.name }}</div>
        <div class="uk-width-expand">
          <progress class="uk-progress uk-progress-small uk-margin-remove" [value]="row.percent" max="100"></progress>
        </div>
        <div class="uk-width-xsmall uk-text-small uk-text-bold uk-text-right">{{ row.formattedValue }}</div>
        <div class="uk-width-xsmall uk-text-small uk-text-meta uk-text-right">{{ row.percent | number:'1.0-1' }}%</div>
      </div>
    }

    <hr class="uk-margin-small">

    <div class="uk-grid-small uk-flex-middle" uk-grid>
      <div class="uk-width-expand uk-text-small uk-text-bold">{{ totalRow().label }}</div>
      <div class="uk-width-xsmall uk-text-small uk-text-bold uk-text-right">{{ totalRow().formattedValue }}</div>
      <div class="uk-width-xsmall uk-text-small uk-text-meta uk-text-right">
        {{ totalRow().percent | number:'1.0-1' }}%@if (format() === 'currency') { of EU}
      </div>
    </div>
  </ng-template>
</app-card-state>
