<app-card-state [state]="state()" [height]="200" [empty]="isEmpty()">
  <ng-template>
    @if (trendChartOptions(); as options) {
      <highcharts-chart [Highcharts]="Highcharts" [options]="options" [oneToOne]="true"
                        style="width: 100%; display: block;"></highcharts-chart>
    }
  </ng-template>
</app-card-state>
