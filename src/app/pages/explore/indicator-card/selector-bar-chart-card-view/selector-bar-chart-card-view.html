<app-card-state [state]="state()" [height]="200" [empty]="isEmpty()">
  <ng-template>
    <!-- The bars also need the category codes, which may still come from /members. -->
    @if (ready()) {
      <app-multi-chart chartType="bar" [series]="chartSeries()" [categories]="categories()"
                        valueSuffix="%" [groupPadding]="0.2" [pointPadding]="0.05" [pointWidth]="15" [height]="600" />
    } @else {
      <app-loading-placeholder [height]="200" />
    }
  </ng-template>
</app-card-state>
