<app-card-state [state]="state()" [height]="200" [empty]="isEmpty()">
  <ng-template>
    <!-- The bars also need the category codes, which may still come from /members. -->
    @if (ready()) {
      <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions()" [oneToOne]="true"
                        style="width: 100%; display: block;"></highcharts-chart>
      @if (hasPausedYears()) {
        <p class="uk-text-small uk-text-muted uk-margin-small-top">* Missing bars indicate years in which the question was paused.</p>
      }
    } @else {
      <app-loading-placeholder [height]="200" />
    }
  </ng-template>
</app-card-state>
