<div class="uk-card uk-card-default uk-card-small uk-card-body">
  <div class="uk-flex uk-flex-between uk-flex-middle">
    <div class="uk-text-bold">{{ indicator().label }}</div>
    <span class="uk-text-meta uk-text-xsmall uk-text-uppercase">{{ indicator().group }}</span>
  </div>

  @switch (cardViewKind()) {
    @case ('eu-snapshot') {
      <div class="uk-flex uk-flex-middle" style="gap: 8px;">
        <span class="uk-text-large uk-text-bold">{{ mockScalarValue }}%</span>
        <span class="uk-text-meta uk-text-small">EU-wide</span>
        <span class="uk-text-danger uk-text-bold uk-text-small">{{ mockScalarDelta }}%</span>
      </div>
    }
    @case ('eu-trend') {
      <app-eu-trend-card-view [startYear]="startYear()" [endYear]="endYear()"></app-eu-trend-card-view>
    }
    @case ('countries-trend') {
      <app-countries-trend-card-view
        [startYear]="startYear()"
        [endYear]="endYear()"
        [selectedCountryIds]="selectedCountryIds()">
      </app-countries-trend-card-view>
    }
    @case ('countries-snapshot') {
      <div class="uk-text-meta">[countries-snapshot placeholder]</div>
    }
  }
</div>
