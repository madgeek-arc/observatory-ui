<app-card-state [state]="state()" [height]="280" [empty]="isEmpty()">
  <ng-template>
    <span class="uk-text-bold" style="font-size: 20px;">
      {{ latestPercent() | formatPercent }}  </span><span class="uk-text-muted">open access in {{ latestYear() }}</span>

      @let delta = deltaVsFirstYear();
      @if (delta !== undefined) {
        <span class="uk-text-small uk-text-meta">
          {{ delta >= 0 ? '+' : '' }}{{ delta }} pts vs {{ firstYear() }}
        </span>
      }


    <div class="uk-margin-small-top" style="height: 280px;">
      <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions()" [oneToOne]="true"
                        style="width: 100%; height: 100%; display: block;"></highcharts-chart>
    </div>
  </ng-template>
</app-card-state>
