@if (countryValues(); as items) {
  @for (item of items; track item.id) {
    @if (item.value !== undefined) {
      <div class="uk-flex uk-flex-middle uk-margin-small-bottom" style="gap: 8px;">
        <span class="uk-text-small">{{ item.name }}</span>
        @if (format() === 'percentage') {
          <progress class="uk-progress uk-width-expand" [value]="item.value" max="100"></progress>
        }
        <span class="uk-text-bold uk-text-small uk-margin-auto-left">{{ item.formattedValue }}</span>
      </div>
    }
  }
} @else {
  <div class="uk-text-meta uk-text-small">Loading…</div>
}
