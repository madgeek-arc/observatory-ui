@if (ready()) {
  <div class="uk-child-width-1-2@m uk-child-width-1-2@l uk-child-width-1-1@s uk-grid-match uk-grid-row-medium" uk-grid>
    @for (chart of countryCharts(); track chart.id) {
      <div>
        <div class="uk-flex uk-flex-middle uk-flex-between uk-margin-small-bottom">
          <span class="uk-text-small uk-text-bold">{{ chart.name }}</span>
          <span class="uk-text-small uk-text-meta">{{ chart.latestPercent }}% OA</span>
        </div>
        <div style="height: 200px;">
          <app-stacked-column
            [categories]="categories()"
            [series]="chart.series"
            [pointFormat]="tooltipPointFormat"
            [stackLabels]="false"
            [dataLabels]="false"
            [legend]="legendOff"
            [height]="200">
          </app-stacked-column>
        </div>
      </div>
    }
  </div>

  <div class="uk-flex uk-flex-wrap uk-margin-medium-top" style="gap: 12px;">
    @for (item of legendItems(); track item.code) {
      <div class="uk-flex uk-flex-middle" style="gap: 6px;">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%;" [style.background]="item.color"></span>
        <span class="uk-text-small uk-text-meta">{{ item.label }}</span>
      </div>
    }
  </div>
} @else {
  <app-loading-placeholder [height]="280" />
}
