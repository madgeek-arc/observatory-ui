<app-card-state [state]="state()" [height]="60" [empty]="isEmpty()">
  <ng-template>
    @if (countryStatuses(); as rows) {
      @for (row of rows; track row.id) {
        <div class="uk-flex uk-flex-between uk-flex-middle uk-margin-small-bottom" style="gap: 8px;">
          <span class="uk-text-small">{{ row.name }}</span>
          <span class="uk-label uk-label-small status-badge" [class]="row.badge.cssClass">
            {{ row.badge.text }}
          </span>
        </div>
      }
      <div class="uk-text-meta uk-text-small uk-margin-small-top">
        {{ positiveCount() }} of {{ totalCount() }} selected countries
      </div>
    }
  </ng-template>
</app-card-state>
