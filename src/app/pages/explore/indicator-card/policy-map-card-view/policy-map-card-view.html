<app-card-state [state]="state()" [height]="300" [empty]="isEmpty()">
  <ng-template>
    @if (mapData(); as data) {
      <div class="uk-grid-small" uk-grid>
        <div class="uk-width-2-3@m">
          <app-highcharts-category-map
            [mapData]="data"
            [height]="400"
            [title]="''"
            [backgroundColor]="'#ffffff'"
            [showLegend]="false">
          </app-highcharts-category-map>
        </div>

        <div class="uk-width-1-3@m">
          @if (leadStatus(); as lead) {
            <div class="uk-text-meta uk-text-small">{{ lead.label }}</div>
            <div class="uk-flex uk-flex-middle uk-margin-small-bottom" style="gap: 8px;">
              <span class="uk-text-large uk-text-bold">{{ lead.count }}</span>
              <span class="uk-text-meta uk-text-small">of {{ totalCount() }} countries</span>
            </div>
          }

          <div class="uk-flex uk-border-rounded uk-overflow-hidden" style="height: 10px;">
            @for (status of statusSummary(); track status.label) {
              <div [style.flex-grow]="status.count" [style.background-color]="status.color"></div>
            }
          </div>

          @for (status of statusSummary(); track status.label) {
            <div class="uk-flex uk-flex-between uk-flex-middle uk-text-small uk-margin-small-top">
              <span class="uk-flex uk-flex-middle" style="gap: 8px;">
                <span class="uk-border-circle uk-flex-none" style="width: 8px; height: 8px;"
                      [style.background-color]="status.color"></span>
                {{ status.label }}
              </span>
              <span class="uk-text-bold">{{ status.count }}</span>
            </div>
          }
        </div>
      </div>
    }
  </ng-template>
</app-card-state>
