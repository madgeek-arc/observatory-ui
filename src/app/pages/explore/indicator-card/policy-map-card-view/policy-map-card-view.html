<app-card-state [state]="state()" [height]="300" [empty]="isEmpty()">
  <ng-template>
    @if (mapData(); as data) {
      <div class="uk-flex uk-flex-middle uk-margin-small-bottom" style="gap: 8px;">
        <span class="uk-text-large uk-text-bold">{{ positiveCount() }}</span>
        <span class="uk-text-meta uk-text-small">of {{ totalCount() }} countries</span>
      </div>
      <app-highcharts-category-map
        [mapData]="data"
        [height]="400"
        [title]="''"
        [backgroundColor]="'#ffffff'">
      </app-highcharts-category-map>
      <div class="uk-text-meta uk-text-small uk-margin-small-top">
        {{ positiveCount() }} of {{ totalCount() }} EU countries
      </div>
    }
  </ng-template>
</app-card-state>
